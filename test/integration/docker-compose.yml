# Mail servers for the Phase 1 integration tests.
#
# Two real daemons, because the adapters target two protocols and two IMAP
# implementations disagree in ways a single one hides:
#
#   james    JMAP (RFC 8620/8621), plus the SMTP submission the IMAP adapter needs
#   dovecot  IMAP (RFC 3501/2177), a different implementation from James's
#
# Neither holds anything real. Ports are high and explicit: this host already
# runs a dozen services.
#
#   bash test/integration/provision.sh      # brings it up and creates the account
services:
  james:
    image: apache/james:memory-latest
    container_name: mail-itest-james
    ports:
      - '18080:80' # JMAP
      - '18000:8000' # webadmin, used only to provision
      - '10143:143' # IMAP, cleartext, LOGINDISABLED until STARTTLS
      - '10993:993' # IMAPS
      - '10587:587' # SMTP submission
    volumes:
      # James refuses to start without one, even for the cleartext listeners.
      # Generated by provision.sh; never committed.
      - ./james-conf/keystore:/root/conf/keystore:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/healthcheck || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60

  dovecot:
    image: dovecot/dovecot:latest
    container_name: mail-itest-dovecot
    ports:
      - '11143:31143' # IMAP
    environment:
      # The image ships `passdb static { password = %{env:USER_PASSWORD} }`:
      # any username authenticates with this one password, which is what a
      # throwaway test server wants. Cleartext, on a container-local port.
      USER_PASSWORD: itest-secret
